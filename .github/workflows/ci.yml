# Builds and tests each module on its own, in parallel, with only its own toolchain (docs/conventions.md).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  server:
    name: Server (with core, providers and packs' derived.js scenarios)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"
      - run: dotnet build src/server
      - run: dotnet test src/server --no-build

  cli:
    name: CLI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"
      - run: dotnet build src/cli
      # The shared libraries' tests already run in the server job.
      - run: dotnet test tests/cli/Stgadgets.Cli.Tests --no-build

  macos-host:
    name: macOS overlay
    # The macOS workload needs Xcode 27, which only the xcode-27 image has so far (macos-latest stops at Xcode 26).
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"
      # The exact Xcode the workload asks for (README).
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "27.0"
      - run: dotnet workload install macos
      - run: dotnet build src/host/macos

  ui:
    name: UI (with packs' UI, tests and derived.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/ui
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: src/ui/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build
      - run: npm test
