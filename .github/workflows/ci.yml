# Builds and tests each module on its own, in parallel, with only its own toolchain (docs/conventions.md).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  server:
    name: Server (with core, providers and packs' derived.js scenarios)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"
      - run: dotnet build src/server
      - run: dotnet test src/server --no-build --collect:"XPlat Code Coverage" --results-directory coverage
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-server
          path: coverage/**/coverage.cobertura.xml

  cli:
    name: CLI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"
      - run: dotnet build src/cli
      # The shared libraries' tests already run in the server job.
      - run: dotnet test tests/cli/Stgadgets.Cli.Tests --no-build --collect:"XPlat Code Coverage" --results-directory coverage
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-cli
          path: coverage/**/coverage.cobertura.xml

  macos-host:
    name: macOS overlay
    # The macOS workload needs Xcode 27, which only the xcode-27 image has so far (macos-latest stops at Xcode 26).
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"
      # The exact Xcode the workload asks for (README).
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "27.0"
      - run: dotnet workload install macos
      - run: dotnet build src/host/macos

  ui:
    name: UI (with packs' UI, tests and derived.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/ui
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: src/ui/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build
      - run: npm run coverage
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-ui
          path: src/ui/coverage/cobertura-coverage.xml

  # One report for every job's coverage: a summary on the run's page, and the full HTML report as an artifact.
  coverage:
    name: Coverage report
    needs: [server, cli, ui]
    runs-on: ubuntu-latest
    steps:
      # The reports point at the source files, which the HTML report shows line by line.
      - uses: actions/checkout@v6
      # ReportGenerator runs on .NET, so it needs the SDK global.json names, like every other job.
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - uses: actions/download-artifact@v8
        with:
          pattern: coverage-*
          path: coverage
      - uses: danielpalme/ReportGenerator-GitHub-Action@5.5.11
        with:
          reports: coverage/**/*.xml
          targetdir: coverage-report
          reporttypes: HtmlInline;MarkdownSummaryGithub
          # Source generators' output, such as [GeneratedRegex] implementations.
          filefilters: -**/obj/**
          title: stgadgets
      - run: cat coverage-report/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage-report
