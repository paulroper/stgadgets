schema: 1

# Where each core's READ_CORE_RAM offset 0 lands in the original hardware's address space, and how many bytes it
# exposes from there. Keyed by RetroArch's system id for the core. See "core profiles" in docs/providers.md.
cores:
  fb_alpha:                     # FBNeo; offset 0 is the 68000's main RAM, as in RetroAchievements' notes
    ram_base: 0x100000
    ram_size: 0x10000           # the core exposes more beyond this, not yet identified
    word_swapped: true          # 68000 words come back little-endian: ship type B reads 01 00 at 0x102CA8
