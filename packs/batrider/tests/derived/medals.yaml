# The next medal's points. medal.value is twice the medal's place in the scale: 100-900 in hundreds, then 1,000-10,000
# in thousands.

start:
  stage.counter: 1
  team.last_index: 2
  p1.status: 0x8E
  p1.active: true

scenarios:
  a chain from the first medal:
    - expect: { medal.next: 100 }
    - set: { medal.value: 2 }
      expect: { medal.next: 200 }
    - set: { medal.value: 6 }
      expect: { medal.next: 400 }

  thousands after 900:
    - set: { medal.value: 16 }
      expect: { medal.next: 900 }
    - set: { medal.value: 18 }
      expect: { medal.next: 1000 }
    - set: { medal.value: 36 }
      expect: { medal.next: 10000 }

  a dropped medal starts again from 100:
    - set: { medal.value: 12 }
      expect: { medal.next: 700 }
    - set: { medal.value: 0 }
      expect: { medal.next: 100 }

  outside play:
    - set: { stage.counter: 0 }
      expect: { medal.next: null }
