# The route, the score, extends and shot power.

start:
  stage.counter: 1
  stage.scene: 1
  course: 2
  stage.order.2: 3
  stage.order.3: 1
  stage.order.4: 2
  team.last_index: 2
  p1.active: true
  p1.status: 0x8E
  p1.score_raw: 1000
  p1.next_extend: 1500000

scenarios:
  the normal course's five stages, the middle three in the chosen order:
    - expect:
        route.1: M.CITY
        route.2: S.SYSTEM
        route.3: AIRPORT
        route.4: SKY HIGH
        route.5: HIGH-WAY
        route.6: null
        route.at: 1
        route.done: 0
        route.extra: null
    - set: { stage.counter: 3, stage.scene: 2 }
      expect: { route.at: 3, route.done: 2 }

  the training course's three:
    - set: { course: 0 }
      expect: { route.1: M.CITY, route.2: S.SYSTEM, route.3: HIGH-WAY, route.4: null }

  the advanced course's seven:
    - set: { course: 4, stage.counter: 7, stage.scene: 7 }
      expect: { route.5: HIGH-WAY, route.6: Z.CITY, route.7: BUILDING, route.at: 7, route.done: 6 }

  a hidden boss's stage, between the course's stages:
    - set: { course: 4, stage.counter: 5, stage.scene: 8 }
      expect: { route.at: null, route.done: 4, route.extra: BASHImk2 }
    - set: { stage.counter: 6, stage.scene: 5 }
      expect: { route.at: 5, route.done: 4, route.extra: null }

  no route on the boss course:
    - set: { course: 6 }
      expect: { route.1: null, route.at: null, route.done: null }

  the score, and the points just scored adding up:
    - expect: { p1.score: 1000, p1.score_gain: null }
    - set: { p1.score_raw: 1100 }
      expect: { p1.score_gain: 100, p1.score_gain_age: 0 }
    - repeat: 10
      expect: { p1.score_gain: 100, p1.score_gain_age: 10 }
    - set: { p1.score_raw: 1400 }
      expect: { p1.score_gain: 400, p1.score_gain_age: 0 }
    - repeat: 60
      expect: { p1.score_gain: null }

  extends:
    - expect: { p1.next_extend_at: 1500000 }
    - set: { p1.next_extend: 0xFFFFFFFF }
      expect: { p1.next_extend_at: null }

  small shot items still needed, 2, 3 and 4 at levels 0, 1 and 2:
    - expect: { p1.shot_items_needed: 2 }
    - set: { p1.shot_items: 1 }
      expect: { p1.shot_items_needed: 1 }
    - set: { p1.shot_level: 2, p1.shot_items: 0 }
      expect: { p1.shot_items_needed: 4 }
    - set: { p1.shot_level: 3 }
      expect: { p1.shot_items_needed: null }

  outside play:
    - set: { stage.counter: 0 }
      expect: { p1.score: null, route.1: null, p1.shot_items_needed: null }
